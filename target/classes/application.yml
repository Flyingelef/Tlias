spring:
  application:
    name: Tlias
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tlias?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGEME
mybatis:
  configuration:
    log-impl:  org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 开启驼峰映射
    map-underscore-to-camel-case: true
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    # 打印项目里的类（DEBUG详细信息）
    com.imlyb.tlias: debug
  file:
    name: logs/tlias.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
# 阿里云连接参数配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java-2610
    region: cn-beijing